name: config-integrity

on:
  pull_request:
    paths:
      - "agents/**"
      - "skills/**"
      - "opencode.json"
      - "rules/**"
      - "bin/**"
      - "templates/**"
      - "scripts/**"
      - ".gitattributes"
      - "scripts/validate-opencode-config.sh"
      - "scripts/check-crlf.sh"
      - ".github/workflows/config-integrity.yml"
  push:
    branches: [main, master]
    paths:
      - "agents/**"
      - "skills/**"
      - "opencode.json"
      - "rules/**"
      - "bin/**"
      - "templates/**"
      - "scripts/**"
      - ".gitattributes"
      - "scripts/validate-opencode-config.sh"
      - "scripts/check-crlf.sh"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Check CRLF in tooling paths
        run: bash scripts/check-crlf.sh
      - name: Validate OpenCode config
        run: bash scripts/validate-opencode-config.sh
